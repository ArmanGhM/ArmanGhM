<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 134" width="112" height="134" role="img" aria-labelledby="t d"><title id="t">Advanced (learning)</title><desc id="d">Advanced technology tile, currently learning</desc><style>text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif}
.bob{animation:bob 3.4s ease-in-out infinite;animation-delay:2.25s}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.chase{animation:ch 5s linear infinite;animation-delay:2.25s}@keyframes ch{to{stroke-dashoffset:-420}}
.pl{animation:pl 2.2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.55}50%{opacity:1}}
.halo{animation:hl 3.4s ease-in-out infinite;animation-delay:2.25s}@keyframes hl{0%,100%{opacity:.35}50%{opacity:.75}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><radialGradient id="h" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#A78BFA" stop-opacity=".55"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="1" y="1" width="110" height="132" rx="18" fill="#101726" stroke="#A78BFA" stroke-width="1.4" stroke-dasharray="6 5"/><rect class="chase" x="1" y="1" width="110" height="132" rx="18" fill="none" stroke="#A78BFA" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="44 400" filter="url(#glow)"/><circle class="halo" cx="56" cy="52" r="40" fill="url(#h)"/><g class="bob"><text x="56" y="62" text-anchor="middle" font-size="30" font-weight="900" font-family="'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace" fill="#FFB84D">JS<tspan fill="#34F5A0">+</tspan></text></g><text x="56" y="100" text-anchor="middle" font-size="14.5" font-weight="700" fill="#E6EAF2">Advanced</text><text x="56" y="116" text-anchor="middle" font-size="12" fill="#8B97B0">JS &amp; React</text><g class="pl"><rect x="22" y="-1" width="68" height="17" rx="8.5" fill="#0A0E17" stroke="#A78BFA" stroke-width="1.2"/><text x="56" y="11.5" text-anchor="middle" font-size="9.5" font-weight="700" letter-spacing="1" fill="#A78BFA">LEARNING</text></g></svg>
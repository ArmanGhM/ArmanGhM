<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 134" width="112" height="134" role="img" aria-labelledby="t d"><title id="t">Tailwind CSS</title><desc id="d">Tailwind CSS technology tile</desc><style>text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif}
.bob{animation:bob 3.4s ease-in-out infinite;animation-delay:1.35s}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.chase{animation:ch 5s linear infinite;animation-delay:1.35s}@keyframes ch{to{stroke-dashoffset:-420}}
.pl{animation:pl 2.2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.55}50%{opacity:1}}
.halo{animation:hl 3.4s ease-in-out infinite;animation-delay:1.35s}@keyframes hl{0%,100%{opacity:.35}50%{opacity:.75}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><radialGradient id="h" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#06B6D4" stop-opacity=".55"/><stop offset="1" stop-color="#06B6D4" stop-opacity="0"/></radialGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="1" y="1" width="110" height="132" rx="18" fill="#101726" stroke="#1F2B47" stroke-width="1.4"/><rect class="chase" x="1" y="1" width="110" height="132" rx="18" fill="none" stroke="#06B6D4" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="44 400" filter="url(#glow)"/><circle class="halo" cx="56" cy="52" r="40" fill="url(#h)"/><g class="bob"><g transform="translate(56 52) scale(2.35) translate(-12 -12)"><path d="M12.001,4.8c-3.2,0-5.2,1.6-6,4.8c1.2-1.6,2.6-2.2,4.2-1.8c0.913,0.228,1.565,0.89,2.288,1.624 C13.666,10.618,15.027,12,18.001,12c3.2,0,5.2-1.6,6-4.8c-1.2,1.6-2.6,2.2-4.2,1.8c-0.913-0.228-1.565-0.89-2.288-1.624 C16.337,6.182,14.976,4.8,12.001,4.8z M6.001,12c-3.2,0-5.2,1.6-6,4.8c1.2-1.6,2.6-2.2,4.2-1.8c0.913,0.228,1.565,0.89,2.288,1.624 c1.177,1.194,2.538,2.576,5.512,2.576c3.2,0,5.2-1.6,6-4.8c-1.2,1.6-2.6,2.2-4.2,1.8c-0.913-0.228-1.565-0.89-2.288-1.624 C10.337,13.382,8.976,12,6.001,12z" fill="#06B6D4"/></g></g><text x="56" y="106" text-anchor="middle" font-size="14.5" font-weight="700" fill="#E6EAF2">Tailwind CSS</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 134" width="112" height="134" role="img" aria-labelledby="t d"><title id="t">Vercel</title><desc id="d">Vercel technology tile</desc><style>text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif}

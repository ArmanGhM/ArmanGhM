<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 112 134" width="112" height="134" role="img" aria-labelledby="t d"><title id="t">Flexbox</title><desc id="d">Flexbox technology tile</desc><style>text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif}
.bob{animation:bob 3.4s ease-in-out infinite;animation-delay:2.25s}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.chase{animation:ch 5s linear infinite;animation-delay:2.25s}@keyframes ch{to{stroke-dashoffset:-420}}
.pl{animation:pl 2.2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.55}50%{opacity:1}}
.halo{animation:hl 3.4s ease-in-out infinite;animation-delay:2.25s}@keyframes hl{0%,100%{opacity:.35}50%{opacity:.75}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><radialGradient id="h" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#D7FF00" stop-opacity=".55"/><stop offset="1" stop-color="#D7FF00" stop-opacity="0"/></radialGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="2.4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="1" y="1" width="110" height="132" rx="18" fill="#101726" stroke="#1F2B47" stroke-width="1.4"/><rect class="chase" x="1" y="1" width="110" height="132" rx="18" fill="none" stroke="#D7FF00" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="44 400" filter="url(#glow)"/><circle class="halo" cx="56" cy="52" r="40" fill="url(#h)"/><g class="bob"><g transform="translate(56 52)"><rect x="-27" y="-24" width="54" height="48" rx="9" fill="none" stroke="#5B6786" stroke-width="2"/><rect x="-19" y="-14" width="10" height="28" rx="3" fill="#D7FF00"/><rect x="-5" y="-14" width="10" height="18" rx="3" fill="#22D3EE"/><rect x="9" y="-14" width="10" height="23" rx="3" fill="#A78BFA"/></g></g><text x="56" y="106" text-anchor="middle" font-size="14.5" font-weight="700" fill="#E6EAF2">Flexbox</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 30" width="1200" height="30" role="img" aria-labelledby="t d"><title id="t">Divider</title><desc id="d">Decorative animated divider</desc><style>.spin{transform-box:fill-box;transform-origin:center;animation:sp 6s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.pl{animation:pl 2.4s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.4}50%{opacity:1}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#34F5A0" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".9"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient><filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><path id="p" d="M40 15 H1160"/></defs><rect x="40" y="14" width="1120" height="2" rx="1" fill="url(#g)"/><rect class="spin pl" x="592" y="7" width="16" height="16" rx="3" fill="none" stroke="#D7FF00" stroke-width="2" filter="url(#glow)"/><circle r="4" fill="#34F5A0" filter="url(#glow)"><animateMotion dur="5s" repeatCount="indefinite" keyPoints="0;1;0" keyTimes="0;.5;1" calcMode="linear"><mpath href="#p"/></animateMotion></circle></svg>
ll="#E6EAF2">CSS</text><rect x="154" y="190" width="105" height="28" rx="14" fill="#141C2E" stroke="#22D3EE" stroke-opacity=".55"/><text class="m" x="206.5" y="209" text-anchor="middle" font-size="13.5" fill="#E6EAF2">JavaScript</text><rect x="36" y="226" width="138" height="28" rx="14" fill="#141C2E" stroke="#22D3EE" stroke-opacity=".55"/><text class="m" x="105.0" y="245" text-anchor="middle" font-size="13.5" fill="#E6EAF2">Tailwind CSS 4</text><rect x="182" y="226" width="72" height="28" rx="14" fill="#141C2E" stroke="#22D3EE" stroke-opacity=".55"/><text class="m" x="218.0" y="245" text-anchor="middle" font-size="13.5" fill="#E6EAF2">Navigo</text><text class="m" x="36" y="318" font-size="15" fill="#22D3EE">↗ github.com/ArmanGhM/shahrava</text><g transform="translate(494 42)">

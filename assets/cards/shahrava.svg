<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d"><title id="t">SHAHRAVA</title><desc id="d">Project card: SHAHRAVA, an interactive world city explorer in development, built with HTML, CSS, JavaScript and Tailwind CSS.</desc><style>text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif}.m{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace}
.chase{animation:ch 7s linear infinite}@keyframes ch{to{stroke-dashoffset:-2300}}
.pl{animation:pl 2s ease-in-out infinite}@keyframes pl{0%,100%{opacity:.4}50%{opacity:1}}

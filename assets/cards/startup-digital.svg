<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" role="img" aria-labelledby="t d"><title id="t">Startup Digital</title><desc id="d">Project card: Startup Digital, a live multi-section startup website built with React 19, Vite, Tailwind CSS 4, React Router 7 and i18next, with dark mode.</desc><style>text{font-family:'Segoe UI','Inter','Helvetica Neue',Arial,'DejaVu Sans',sans-serif}.m{font-family:'JetBrains Mono','SF Mono','Cascadia Code',Menlo,Consolas,'DejaVu Sans Mono',monospace}

name: Update stats card

on:
  schedule:
    - cron: "17 3 * * *"        # every day, 03:17 UTC
  workflow_dispatch:             # "Run workflow" button
  push:
    paths:
      - "scripts/generate-stats.mjs"

permissions:
  contents: write

concurrency:
  group: stats-card
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate assets/stats.svg
        env:
          GH_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/generate-stats.mjs
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "chore(stats): refresh stats card"
            git push
          fi
